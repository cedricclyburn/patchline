<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patchline readiness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/ui/style.css">
  <script type="module" src="/ui/app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <span class="wordmark">Patchline</span>
      <span class="title">Remediation readiness</span>
    </div>
    <div class="stream" id="stream" data-state="connecting" role="status">
      <i aria-hidden="true"></i>
      <span id="stream-label">Connecting</span>
      <span class="stream-meta" id="stream-meta"></span>
    </div>
    <button class="btn btn-primary" id="run-fleet" type="button">Run fleet</button>
  </header>

  <main>
    <section class="board" aria-label="Readiness poll">
      <div class="poll" id="poll" role="table" aria-label="Station calls for each repository"></div>
      <div class="board-foot" id="board-foot"></div>
    </section>

    <section class="detail" id="detail" aria-live="polite"></section>
  </main>
</body>
</html>
